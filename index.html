<style>

    --pt:#A8447A; --pt-soft:#F5E1EC;
    --off:#8A8578; --off-soft:#EEECE6;
    --red:#C0392B; --red-soft:#FBE3E1;

  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);}
  .wrap{max-width:760px;margin:0 auto;padding:16px;}
  .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;}
  .eyebrow{font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
  h1{font-size:26px;font-weight:600;margin:0;font-family:Georgia,"Noto Serif TC",serif;}
  .navbtns{display:flex;gap:6px;align-items:center;}
  .iconbtn{width:36px;height:36px;border-radius:999px;border:none;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;}
  .pillbtn{border-radius:999px;border:none;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08);cursor:pointer;padding:8px 14px;font-size:13px;}
  .darkbtn{background:var(--ink);color:#fff;}
  .summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:20px;}
  @media(min-width:640px){.summary{grid-template-columns:repeat(7,1fr);}}
  .card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .card .lbl{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .card .val{font-size:18px;font-weight:600;}
  .card .sub{font-size:11px;color:var(--muted2);}
  .card.total{grid-column:span 2;background:var(--ink);color:#fff;display:flex;flex-direction:column;gap:6px;justify-content:center;}
  .card.total .lbl{color:#C9C5B8;}
  .card.total .row{display:flex;gap:16px;align-items:baseline;}
  .card.total .subline{font-size:10px;color:#C9C5B8;}
  .card.total .amt{font-size:16px;font-weight:600;}
  .card.total .foot{font-size:11px;color:#C9C5B8;border-top:1px solid rgba(255,255,255,.15);padding-top:6px;}

  .daycell{height:118px;border-right:1px solid var(--line);padding:6px;text-align:left;background:none;border-top:none;border-bottom:none;border-left:none;cursor:pointer;display:flex;flex-direction:column;gap:4px;width:100%;font-family:inherit;overflow-y:auto;}

  .note{font-size:11px;color:var(--muted2);margin-top:8px;}
  .hidden{display:none;}
  a.linklike{font-size:11px;color:inherit;text-decoration:underline;}

/* ---------- 小工具 ---------- */
function pad2(n){return String(n).padStart(2,"0");}
function monthKeyOf(y,m){return `${y}-${pad2(m+1)}`;}
function dateKeyOf(y,m,d){return `${monthKeyOf(y,m)}-${pad2(d)}`;}
function processRoom(raw){const r=(raw||"").trim();if(r.length===3&&r[0]==="2")return r.slice(1);return r;}
function timeToMinutes(t){const [h,m]=t.split(":").map(Number);return h*60+m;}
function durationHours(times,type){const c=times[type];if(!c)return 0;return (timeToMinutes(c.end)-timeToMinutes(c.start))/60;}
function formatHours(h){return Number.isInteger(h)?String(h):h.toFixed(1);}
function getMonthWeeks(y,m){
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const cells=[];
  for(let i=0;i<first;i++)cells.push(null);
  for(let d=1;d<=days;d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);
  const weeks=[];
  for(let i=0;i<cells.length;i+=7)weeks.push(cells.slice(i,i+7));
  return weeks;
}
const todayStr=(()=>{const t=new Date();return dateKeyOf(t.getFullYear(),t.getMonth(),t.getDate());})();

/* ---------- localStorage 存取 ---------- */
function lsGet(key){try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));return true;}catch(e){return false;}}
const LS_PREFIX = "fju-schedule:";

/* ---------- 全域狀態 ---------- */
const now = new Date();
let state = {
  year: now.getFullYear(),
  monthIndex: now.getMonth(),
  scheduleData: {},
  shiftTimes: DEFAULT_TIMES,
  selectedDay: null,
  addingType: null,
  editingIndex: null,
  roomInput: "",
  codeInput: "",
  doctorInput: "",
  showSettings: false,
  draftTimes: DEFAULT_TIMES,
  importTarget: null,
  copyMsg: "",
  error: "",
};

function loadShiftTimes(){
  const saved = lsGet(LS_PREFIX + "settings:shiftTimes");
  state.shiftTimes = saved ? Object.assign({}, DEFAULT_TIMES, saved) : DEFAULT_TIMES;
}
function loadMonth(){
  const key = monthKeyOf(state.year, state.monthIndex);
  const saved = lsGet(LS_PREFIX + "schedule:" + key);
  state.scheduleData = saved || {};
}
function persistMonth(updated){
  state.scheduleData = updated;
  const key = monthKeyOf(state.year, state.monthIndex);
  const ok = lsSet(LS_PREFIX + "schedule:" + key, updated);
  state.error = ok ? "" : "儲存失敗，請再試一次（可能是瀏覽器儲存空間已滿或為無痕模式）";
  render();
}

/* ---------- 計算 ---------- */
function computeTotals(){
  const t = {A:{count:0,hours:0},B:{count:0,hours:0},C:{count:0,hours:0},PT:{count:0,hours:0}};
  Object.values(state.scheduleData).forEach(list=>{
    (list||[]).forEach(e=>{
      if(!t[e.type])return;
      t[e.type].count++;
      t[e.type].hours += durationHours(state.shiftTimes, e.type);
    });
  });
  const totalHours = Object.values(t).reduce((s,x)=>s+x.hours,0);
  return Object.assign({},t,{totalHours});
}
function computeOffDays(){
  const days = new Date(state.year, state.monthIndex+1, 0).getDate();
  let n=0;
  for(let d=1; d<=days; d++){
    const key = dateKeyOf(state.year, state.monthIndex, d);
    const entries = state.scheduleData[key] || [];
    const hasWork = entries.some(e=>["A","B","C","PT"].includes(e.type));
    if(!hasWork)n++;
  }
  return n;
}

/* ---------- 匯出 ---------- */
function buildMonthRows(){
  const count = new Date(state.year, state.monthIndex+1, 0).getDate();
  const rows = [];
  for(let d=1; d<=count; d++){
    const key = dateKeyOf(state.year, state.monthIndex, d);
    const entries = state.scheduleData[key] || [];
    const holiday = HOLIDAYS_2026[key];
    const work = entries.filter(e=>["A","B","C","PT"].includes(e.type));
    let codes = work.map(e=> e.doctor ? `${e.code}(${e.doctor})` : e.code).join("+");
    if(!codes) codes = holiday ? `休診・${holiday}` : "OFF";
    const hours = work.reduce((s,e)=>s+durationHours(state.shiftTimes,e.type),0);
    const wd = WEEKDAYS[new Date(state.year, state.monthIndex, d).getDay()];
    rows.push({date:`${state.year}/${pad2(state.monthIndex+1)}/${pad2(d)}`, weekday:wd, codes, hours});
  }
  return rows;
}
function handleCopyText(){
  const rows = buildMonthRows();
  const totals = computeTotals();
  let text = `輔大醫院門診 個人排班 - ${state.year}年${state.monthIndex+1}月\n\n`;
  rows.forEach(r=>{ text += `${r.date}(${r.weekday})  ${r.codes}${r.hours? "  "+formatHours(r.hours)+"hr":""}\n`; });
  text += `\n本月總工時：${formatHours(totals.totalHours)} 小時\n`;
  text += `早診A ${totals.A.count}診 ${formatHours(totals.A.hours)}hr／午診B ${totals.B.count}診 ${formatHours(totals.B.hours)}hr／晚診C ${totals.C.count}診 ${formatHours(totals.C.hours)}hr／兼職PT ${totals.PT.count}次 ${formatHours(totals.PT.hours)}hr`;
  navigator.clipboard.writeText(text).then(()=>{
    state.copyMsg = "已複製本月班表文字"; render();
    setTimeout(()=>{state.copyMsg="";render();},2500);
  }).catch(()=>{
    state.copyMsg = "複製失敗，請改用下載 CSV"; render();
    setTimeout(()=>{state.copyMsg="";render();},2500);
  });
}
function handleDownloadCSV(){
  const rows = buildMonthRows();
  const totals = computeTotals();
  let csv = "日期,星期,班別代碼,當日工時(hr)\n";
  rows.forEach(r=>{ csv += `${r.date},${r.weekday},${r.codes},${r.hours?formatHours(r.hours):""}\n`; });
  csv += `\n總計,,,${formatHours(totals.totalHours)}\n`;
  csv += `早診A,${totals.A.count}診,,${formatHours(totals.A.hours)}\n`;
  csv += `午診B,${totals.B.count}診,,${formatHours(totals.B.hours)}\n`;
  csv += `晚診C,${totals.C.count}診,,${formatHours(totals.C.hours)}\n`;
  csv += `兼職PT,${totals.PT.count}次,,${formatHours(totals.PT.hours)}\n`;
  downloadBlob(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8;"}), `排班表_${monthKeyOf(state.year,state.monthIndex)}.csv`);
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function handleExportBackup(){
  const backup = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(LS_PREFIX)===0){
      backup[k.slice(LS_PREFIX.length)] = JSON.parse(localStorage.getItem(k));
    }
  }
  downloadBlob(new Blob([JSON.stringify(backup,null,2)],{type:"application/json"}), `輔大排班備份_${new Date().toISOString().slice(0,10)}.json`);
}
function handleImportBackupFile(file){
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      Object.entries(data).forEach(([k,v])=>{ lsSet(LS_PREFIX+k, v); });
      loadShiftTimes(); loadMonth();
      state.copyMsg = "備份已匯入";
      render();
      setTimeout(()=>{state.copyMsg="";render();},2500);
    }catch(e){
      state.error = "備份檔案格式錯誤，匯入失敗";
      render();
    }
  };
  reader.readAsText(file);
}

/* ---------- 匯入內科組班表 ---------- */
function performImport(targetMonthKey, dataset){
  let base = {};
  const curKey = monthKeyOf(state.year, state.monthIndex);
  if(curKey === targetMonthKey){ base = Object.assign({}, state.scheduleData); }
  else { base = lsGet(LS_PREFIX+"schedule:"+targetMonthKey) || {}; }
  const merged = Object.assign({}, base);
  Object.entries(dataset).forEach(([date,entries])=>{
    const existing = merged[date] || [];
    const keep = existing.filter(e=>e.type==="PT"||e.type==="OFF");
    merged[date] = entries.concat(keep);
  });
  lsSet(LS_PREFIX+"schedule:"+targetMonthKey, merged);
  const [ty,tm] = targetMonthKey.split("-").map(Number);
  state.year = ty; state.monthIndex = tm-1;
  loadMonth();
  state.copyMsg = `已匯入 ${tm} 月內科組班表`;
  render();
  setTimeout(()=>{state.copyMsg="";render();},2500);
}

/* ---------- 事件處理 ---------- */
function goMonth(delta){
  let m = state.monthIndex + delta, y = state.year;
  if(m<0){m=11;y--;} else if(m>11){m=0;y++;}
  state.year=y; state.monthIndex=m;
  closeDayModal(false);
  loadMonth();
  render();
}
function goToday(){
  state.year = now.getFullYear(); state.monthIndex = now.getMonth();
  loadMonth(); render();
}
function openDay(day){
  if(!day)return;
  state.selectedDay = day;
  state.addingType = null; state.editingIndex=null;
  state.roomInput=""; state.codeInput=""; state.doctorInput="";
  render();
}
function closeDayModal(doRender=true){
  state.selectedDay=null; state.addingType=null; state.editingIndex=null;
  state.roomInput=""; state.codeInput=""; state.doctorInput="";
  if(doRender)render();
}
function startAdd(type){
  state.addingType=type; state.editingIndex=null;
  state.roomInput=""; state.codeInput= type==="PT" ? "PT" : type; state.doctorInput="";
  render();
}
function startEdit(idx, entry){
  state.addingType = entry.type; state.editingIndex = idx;
  state.roomInput = entry.room || ""; state.codeInput = entry.code || entry.type; state.doctorInput = entry.doctor || "";
  render();
}
function onRoomInput(v){
  state.roomInput = v;
  if(state.addingType && state.addingType!=="PT" && state.addingType!=="OFF"){
    state.codeInput = state.addingType + processRoom(v);
  }
  render();
}
function confirmAdd(){
  if(!state.selectedDay || !state.addingType) return;
  if(state.addingType!=="PT" && state.addingType!=="OFF" && !state.roomInput.trim()) return;
  const dateStr = dateKeyOf(state.year, state.monthIndex, state.selectedDay);
  const entry = {
    type: state.addingType,
    room: (state.addingType==="PT"||state.addingType==="OFF") ? "" : state.roomInput.trim(),
    code: state.codeInput.trim() || state.addingType,
    doctor: state.doctorInput.trim(),
  };
  const updated = Object.assign({}, state.scheduleData);
  const list = updated[dateStr] ? updated[dateStr].slice() : [];
  if(state.editingIndex!==null && list[state.editingIndex]) list[state.editingIndex] = entry;
  else list.push(entry);
  updated[dateStr] = list;
  persistMonth(updated);
  state.addingType=null; state.editingIndex=null; state.roomInput=""; state.codeInput=""; state.doctorInput="";
  render();
}
function deleteEntry(dateStr, idx){
  const updated = Object.assign({}, state.scheduleData);
  const list = (updated[dateStr]||[]).slice();
  list.splice(idx,1);
  if(list.length===0) delete updated[dateStr]; else updated[dateStr]=list;
  persistMonth(updated);
}
function openSettings(){ state.draftTimes = JSON.parse(JSON.stringify(state.shiftTimes)); state.showSettings=true; render(); }
function closeSettings(){ state.showSettings=false; render(); }
function saveSettings(){
  state.shiftTimes = state.draftTimes;
  lsSet(LS_PREFIX+"settings:shiftTimes", state.shiftTimes);
  state.showSettings=false; render();
}
function setDraftTime(type, field, val){ state.draftTimes[type][field]=val; render(); }

/* ---------- Render ---------- */
function esc(s){ return (s===undefined||s===null) ? "" : String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;"); }

function render(){
  const totals = computeTotals();
  const offDays = computeOffDays();
  const weeks = getMonthWeeks(state.year, state.monthIndex);

  let html = "";
  html += `<div class="header">
    <div>
      <div class="eyebrow">輔大醫院門診 個人排班</div>
      <h1>${state.year} 年 ${state.monthIndex+1} 月</h1>
    </div>
    <div class="navbtns">
      <button class="iconbtn" onclick="goMonth(-1)">‹</button>
      <button class="pillbtn" onclick="goToday()">本月</button>
      <button class="iconbtn" onclick="goMonth(1)">›</button>
      <button class="iconbtn" onclick="openSettings()">⚙</button>
    </div>
  </div>`;

  html += `<div class="summary">`;
  ["A","B","C","PT"].forEach(type=>{
    const m = SHIFT_META[type];
    html += `<div class="card" style="border-top:3px solid ${m.color}">
      <div class="lbl">${m.label}</div>
      <div class="val" style="color:${m.color}">${formatHours(totals[type].hours)}<span style="font-size:11px;font-weight:400;margin-left:4px;">hr</span></div>
      <div class="sub">${totals[type].count} 診</div>
    </div>`;
  });
  html += `<div class="card" style="border-top:3px solid var(--red)">
    <div class="lbl">本月 OFF</div>
    <div class="val" style="color:var(--red)">${offDays}<span style="font-size:11px;font-weight:400;margin-left:4px;">天</span></div>
    <div class="sub">含週日／假日</div>
  </div>`;
  const ftHours = totals.A.hours + totals.B.hours + totals.C.hours;
  html += `<div class="card total">
    <div class="lbl">🕐 本月總工時</div>
    <div class="row">
      <div><div class="subline">正職（A+B+C）</div><div class="amt">${formatHours(ftHours)}<span style="font-size:10px;font-weight:400;">hr</span></div></div>
      <div><div class="subline">兼職（PT）</div><div class="amt">${formatHours(totals.PT.hours)}<span style="font-size:10px;font-weight:400;">hr</span></div></div>
    </div>
    <div class="foot">= 共 ${formatHours(totals.totalHours)} 小時</div>
  </div>`;
  html += `</div>`;

  html += `<div class="exportrow">
    <button class="pillbtn darkbtn" onclick="state.importTarget='aug';render();">⭱ 匯入 8 月班表</button>
    <button class="pillbtn darkbtn" onclick="state.importTarget='sep';render();">⭱ 匯入 9 月班表</button>
    <button class="pillbtn" onclick="handleCopyText()">⧉ 複製本月班表文字</button>
    <button class="pillbtn" onclick="handleDownloadCSV()">⭳ 下載本月 CSV</button>
    ${state.copyMsg?`<span class="msg">${esc(state.copyMsg)}</span>`:""}
  </div>`;

  html += `<div class="exportrow">
    <button class="pillbtn" onclick="handleExportBackup()">⭳ 匯出完整備份 (JSON)</button>
    <button class="pillbtn" onclick="document.getElementById('backupFileInput').click()">⭱ 匯入備份 (JSON)</button>
    <input type="file" id="backupFileInput" accept="application/json" class="hidden" onchange="if(this.files[0])handleImportBackupFile(this.files[0]);this.value='';">
  </div>`;

  if(state.error){ html += `<div class="errbox">${esc(state.error)}</div>`; }

  html += `<div class="cal"><div class="wd">${WEEKDAYS.map(w=>`<div>${w}</div>`).join("")}</div>`;
  weeks.forEach(week=>{
    html += `<div class="weekrow">`;
    week.forEach(day=>{
      if(!day){ html += `<div class="daycell empty"></div>`; return; }
      const dateStr = dateKeyOf(state.year, state.monthIndex, day);
      const entries = state.scheduleData[dateStr] || [];
      const isToday = dateStr===todayStr;
      const isSunday = new Date(state.year, state.monthIndex, day).getDay()===0;
      const holiday = HOLIDAYS_2026[dateStr];
      const work = entries.filter(e=>["A","B","C","PT"].includes(e.type));
      let inner = "";
      if(holiday){
        inner = `<span class="pill" style="background:var(--red-soft);color:var(--red)">休診・${esc(holiday)}</span>`;
      } else if(work.length===0){
        const style = isSunday ? "background:var(--red-soft);color:var(--red)" : "background:var(--off-soft);color:var(--off)";
        inner = `<span class="pill" style="${style}">OFF</span>`;
      } else {
        inner = work.map(e=>{
          const m = SHIFT_META[e.type];
          const title = e.doctor ? ` title="當診醫師：${esc(e.doctor)}"` : "";
          return `<span class="pill" style="background:${m.soft};color:${m.color}"${title}>${esc(e.code)}</span>`;
        }).join("");
      }
      html += `<button class="daycell" onclick="openDay(${day})">
        <span class="daynum ${isToday?"today":""}">${day}</span>
        <div style="display:flex;flex-direction:column;gap:2px;">${inner}</div>
      </button>`;
    });
    html += `</div>`;
  });
  html += `</div>`;

  /* 日期編輯 modal */
  if(state.selectedDay){
    const dateStr = dateKeyOf(state.year, state.monthIndex, state.selectedDay);
    const entries = state.scheduleData[dateStr] || [];
    html += `<div class="modal-bg" onclick="closeDayModal()"><div class="modal" onclick="event.stopPropagation()">
      <h2>${state.year}/${pad2(state.monthIndex+1)}/${pad2(state.selectedDay)}<button onclick="closeDayModal()">✕</button></h2>`;
    if(entries.length>0){
      entries.forEach((e,idx)=>{
        const m = SHIFT_META[e.type];
        const timeTxt = state.shiftTimes[e.type] ? ` ・ ${state.shiftTimes[e.type].start}–${state.shiftTimes[e.type].end}` : "";
        html += `<div class="entryrow" style="background:${m.soft}">
          <div>
            <div class="code" style="color:${m.color}">${esc(e.code)}</div>
            <div class="sub">${m.label}${timeTxt}</div>
            ${e.doctor?`<div class="doc" style="color:${m.color}">當診醫師：${esc(e.doctor)}</div>`:""}
          </div>
          <div class="acts">
            <button onclick='startEdit(${idx}, ${JSON.stringify(e).replace(/'/g,"&apos;")})'>✎</button>
            <button onclick="deleteEntry('${dateStr}',${idx})">🗑</button>
          </div>
        </div>`;
      });
    }
    if(state.addingType===null){
      html += `<div class="typegrid">`;
      ["A","B","C","PT","OFF"].forEach(type=>{
        const m = SHIFT_META[type];
        const sub = state.shiftTimes[type] ? state.shiftTimes[type].start : "全天";
        html += `<button class="typebtn" onclick="startAdd('${type}')"><span class="t" style="color:${m.color}">${type}</span><span class="s">${sub}</span></button>`;
      });
      html += `</div>`;
    } else {
      const type = state.addingType;
      const m = SHIFT_META[type];
      const timeTxt = state.shiftTimes[type] ? `（${state.shiftTimes[type].start}–${state.shiftTimes[type].end}）` : "";
      html += `<div class="formbox">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px;color:${m.color}">${state.editingIndex!==null?"編輯":"新增"} ${m.label}${timeTxt}</div>`;
      if(type!=="PT" && type!=="OFF"){
        html += `<label>診間號（例如 232）</label>
          <input value="${esc(state.roomInput)}" oninput="onRoomInput(this.value)" placeholder="輸入診間號">`;
      }
      html += `<label>顯示代碼（可手動修改）</label>
        <input value="${esc(state.codeInput)}" oninput="state.codeInput=this.value">`;
      if(type!=="OFF"){
        html += `<label>當診醫師（選填，可對照門診表填入）</label>
          <input value="${esc(state.doctorInput)}" oninput="state.doctorInput=this.value" placeholder="例如：林柏辰">`;
      }
      const disabled = (type!=="PT" && type!=="OFF" && !state.roomInput.trim()) ? "disabled" : "";
      html += `<div class="formactions">
        <button class="btn-primary" ${disabled} onclick="confirmAdd()">＋ ${state.editingIndex!==null?"更新":"儲存"}</button>
        <button class="btn-secondary" onclick="state.addingType=null;state.editingIndex=null;render();">取消</button>
      </div></div>`;
    }
    html += `</div></div>`;
  }

  /* 匯入確認 modal */
  if(state.importTarget){
    const label = state.importTarget==="aug" ? "8" : "9";
    html += `<div class="modal-bg" onclick="state.importTarget=null;render();"><div class="modal" onclick="event.stopPropagation()">
      <h2>匯入 ${label} 月班表</h2>
      <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">這會匯入 ${label} 月內科組班表（吳柏辰），並覆蓋 ${label} 月已存在的門診班別（A/B/C）。兼職（PT）與 OFF 紀錄不受影響。確定要匯入嗎？</p>
      <div class="formactions">
        <button class="btn-primary" onclick="performImport('${state.importTarget==="aug"?"2026-08":"2026-09"}', ${state.importTarget==="aug"?"AUG_2026_IMPORT":"SEPT_2026_IMPORT"});state.importTarget=null;">⭱ 確定匯入</button>
        <button class="btn-secondary" onclick="state.importTarget=null;render();">取消</button>
      </div>
    </div></div>`;
  }

  /* 設定 modal */
  if(state.showSettings){
    html += `<div class="modal-bg" onclick="closeSettings()"><div class="modal" onclick="event.stopPropagation()">
      <h2>班別時間設定<button onclick="closeSettings()">✕</button></h2>`;
    ["A","B","C","PT"].forEach(type=>{
      const m = SHIFT_META[type];
      html += `<div class="settingsrow">
        <div class="lab" style="color:${m.color}">${type} ・ ${m.label}</div>
        <input type="time" value="${state.draftTimes[type].start}" onchange="setDraftTime('${type}','start',this.value)">
        <span>–</span>
        <input type="time" value="${state.draftTimes[type].end}" onchange="setDraftTime('${type}','end',this.value)">
      </div>`;
    });
    html += `<p class="note">好幸福泌尿科兼職時段目前為暫定，之後確定後可在此調整，工時會自動重新計算。</p>
      <button class="btn-primary" style="margin-top:12px;width:100%;" onclick="saveSettings()">儲存設定</button>
    </div></div>`;
  }

  document.getElementById("app").innerHTML = html;
}

/* ---------- 初始化 ---------- */
loadShiftTimes();
loadMonth();
render();
</script>
</body>
</html>
